# Build service/frontend -> GitHub Pages. The backend deploys separately (Docker on Render).
#
# VITE_API_URL = the backend URL, set in repo Settings -> Secrets and variables -> Actions ->
# Variables (not Secrets: it is a public URL, and anything baked into the bundle is public anyway).
name: Deploy frontend (GitHub Pages)

on:
  push:
    branches: [test_deploy]
    paths:
      - 'service/frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages runs one deploy at a time; back-to-back pushes cancel the older run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: service/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: service/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
